spring.application.name=inventory-management

# Server & Dynamic Port for Cloud Platforms (Render, Railway, Heroku, AWS)
server.port=${PORT:8080}

# Datasource Configuration (Supports PostgreSQL, MySQL, or H2 Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (Optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:yourVerySecretKeyForJwtTokenGeneration123456}
jwt.expiration=86400000

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
